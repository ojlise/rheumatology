<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RheumAtlas — An Interactive Guide to Rheumatology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6f3; --panel:#ffffff; --ink:#1d1f23; --muted:#5f6670; --line:#e4e2dc; --soft:#f0eee9;
  --accent:#1971c2; --red:#c92a2a; --redbg:#fff1f0; --amber:#e67700; --amberbg:#fff8e6; --green:#2b8a3e; --greenbg:#eefaf0;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05);
  --radius:12px; --serif:"Source Serif 4",Georgia,serif; --sans:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121417; --panel:#1a1d21; --ink:#e8e6e1; --muted:#a2a8b0; --line:#2c3036; --soft:#22262b;
  --redbg:#2a1717; --amberbg:#2a2214; --greenbg:#15241a; --shadow:0 1px 2px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:14px;padding:10px 18px;max-width:1400px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand svg{width:30px;height:30px}
.brand b{font-family:var(--serif);font-size:21px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand span{display:block;font-size:11.5px;color:var(--muted);margin-top:-1px}
.search{position:relative;flex:1;max-width:560px;margin-left:auto}
.search input{width:100%;padding:10px 14px 10px 38px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.14);max-height:70vh;overflow:auto;display:none;z-index:40}
.results.show{display:block}
.res{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;text-decoration:none;display:block}
.res:last-child{border-bottom:0}
.res:hover{background:var(--soft)}
.res b{display:block;font-weight:600}
.res small{color:var(--muted);font-size:12.5px}
.nores{padding:12px 14px;color:var(--muted);font-size:14px}
.navbtn{display:none;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 10px;cursor:pointer}
.toplinks{display:flex;gap:4px}
.toplinks a{padding:7px 11px;border-radius:8px;text-decoration:none;font-size:14px;color:var(--muted);font-weight:500}
.toplinks a:hover,.toplinks a.on{background:var(--soft);color:var(--ink)}
.layout{display:grid;grid-template-columns:290px 1fr;max-width:1400px;margin:0 auto;min-height:calc(100vh - 60px)}
aside.side{border-right:1px solid var(--line);padding:16px 10px 40px 14px;position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto}
.side h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 8px 8px}
.sarea{margin-bottom:6px}
.sarea>a{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px}
.sarea>a:hover,.sarea>a.on{background:var(--soft)}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ssub{padding:2px 0 4px 18px}
.ssub .sl{font-size:11.5px;color:var(--muted);margin:8px 8px 3px;font-weight:600}
.ssub a{display:block;padding:4px 8px;border-radius:6px;font-size:13.5px;text-decoration:none;opacity:.85}
.ssub a:hover{background:var(--soft);opacity:1}
.ssub a.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);opacity:1;font-weight:600}
main{padding:28px 36px 60px;min-width:0}
.wrap{max-width:980px}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:14px}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
h1{font-family:var(--serif);font-size:38px;line-height:1.12;margin:0 0 8px;letter-spacing:-.015em}
h2{font-family:var(--serif);font-size:24px;margin:34px 0 12px;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 8px}
.lede{font-size:17px;color:var(--muted);max-width:760px;margin:0 0 18px}
.aka{color:var(--muted);font-size:14px;margin:-2px 0 14px}
.hero{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 32px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero h1{font-size:44px}
.hero .stats{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap}
.stat b{font-family:var(--serif);font-size:30px;display:block;line-height:1}
.stat span{font-size:12.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
a.card{text-decoration:none;display:block;transition:transform .12s,border-color .12s}
a.card:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c,var(--accent)) 55%,var(--line))}
.acard{border-top:4px solid var(--c)}
.acard b{font-family:var(--serif);font-size:18.5px;display:block;margin-bottom:4px;line-height:1.25}
.acard p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
.acard .n{font-size:12px;font-weight:600;color:var(--c)}
.dcard b{display:block;font-weight:600;margin-bottom:3px}
.dcard p{margin:0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--amberbg);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);margin-top:8px}
.emerg{background:var(--redbg);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);border-radius:14px;padding:16px 20px;margin:18px 0}
.emerg h3{color:var(--red);margin-bottom:10px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:500}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
ul.clean{margin:0;padding-left:0;list-style:none}
ul.clean li{position:relative;padding:5px 0 5px 22px;border-bottom:1px dashed var(--line)}
ul.clean li:last-child{border-bottom:0}
ul.clean li::before{content:"";position:absolute;left:4px;top:13px;width:7px;height:7px;border-radius:50%;background:var(--c,var(--accent))}
.k-early{background:var(--amberbg);border-color:color-mix(in srgb,var(--amber) 28%,transparent)}
.k-early h3{color:var(--amber)}
.k-early li::before{background:var(--amber)!important}
.k-red{background:var(--redbg);border-color:color-mix(in srgb,var(--red) 28%,transparent)}
.k-red h3{color:var(--red)}
.k-red li::before{background:var(--red)!important}
.k-upd{background:var(--greenbg);border-color:color-mix(in srgb,var(--green) 28%,transparent)}
.k-upd h3{color:var(--green)}
.k-upd li::before{background:var(--green)!important}
.txg{margin-bottom:12px}
.txg h3{font-size:14.5px;padding-bottom:6px;border-bottom:2px solid color-mix(in srgb,var(--c) 30%,transparent)}
ol.refs{padding-left:22px;margin:0}
ol.refs li{margin-bottom:8px;font-size:14px}
ol.refs a{color:var(--accent);text-decoration:none;word-break:break-word}
ol.refs a:hover{text-decoration:underline}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:34px}
.pager a{flex:1;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.pager a:hover{border-color:var(--accent)}
.pager small{color:var(--muted);font-size:12px;display:block}
.updlist .u{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.updlist .u:last-child{border:0}
.updlist time{font-size:13px;color:var(--muted);font-weight:600}
.updlist a{color:var(--accent);font-size:13.5px;text-decoration:none;font-weight:500}
.disc{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);margin-top:46px;padding-top:16px}
.hit{font-size:13px;color:var(--muted);margin:14px 0 6px}
.hit b{color:var(--ink)}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 18px;position:sticky;top:57px;z-index:5;background:var(--bg);padding:8px 0}
.pill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:500;color:var(--muted)}
.pill:hover{color:var(--ink);border-color:var(--accent)}
.sec{scroll-margin-top:120px}
.ddt{padding:0;overflow:hidden}
.ddrow{display:grid;grid-template-columns:1.1fr 1.2fr 1.6fr;border-bottom:1px solid var(--line)}
.ddrow:last-child{border-bottom:0}
.ddrow>div{padding:11px 14px;font-size:14px}
.ddrow.head{background:var(--soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.ddrow.head>div{font-size:11.5px;padding:9px 14px}
.ddrow .nm{font-weight:600}
.ddrow .sim{color:var(--muted)}
@media (max-width:900px){.ddrow{grid-template-columns:1fr}.ddrow.head{display:none}.ddrow>div{padding:4px 14px}.ddrow .nm{padding-top:12px}}
.scrim{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  aside.side{position:fixed;left:0;top:0;height:100vh;width:300px;background:var(--panel);z-index:60;transform:translateX(-100%);transition:transform .2s;padding-top:20px}
  body.nav aside.side{transform:none}
  body.nav .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:55}
  .navbtn{display:block}
  .toplinks{display:none}
  main{padding:20px 16px 50px}
  h1{font-size:30px}.hero h1{font-size:32px}.hero{padding:22px}
  .two{grid-template-columns:1fr}
  .brand span{display:none}
  .updlist .u{grid-template-columns:1fr;gap:4px}
}
.toplinks a{padding:7px 9px;font-size:13.5px;white-space:nowrap}
@media (max-width:1320px){.toplinks .opt{display:none}}
@media (max-width:1120px){.brand span{display:none}}
.tarea{margin-bottom:2px}
.tarea>button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;padding:7px 8px;border-radius:8px;cursor:pointer;font-weight:600;font-size:14px}
.tarea>button:hover,.tarea>button.on{background:var(--soft)}
.chev{margin-left:auto;transition:transform .15s;color:var(--muted);font-size:11px}
.tarea.open .chev{transform:rotate(90deg)}
.tsub{display:none;padding:2px 0 6px 18px}
.tarea.open .tsub{display:block}
.tsub .sl{font-size:11.5px;color:var(--muted);margin:8px 8px 3px;font-weight:600}
.tsub a{display:block;padding:4px 8px;border-radius:6px;font-size:13.5px;text-decoration:none;opacity:.85}
.tsub a:hover{background:var(--soft);opacity:1}
.tsub a.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);opacity:1;font-weight:600}
.tlinks a{display:block;padding:6px 8px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:500}
.tlinks a:hover,.tlinks a.on{background:var(--soft)}
.ddrow.c2{grid-template-columns:1fr 2.4fr}
.secnote{font-size:13px;color:var(--muted);margin:-4px 0 12px}
.emcard{border-left:4px solid var(--c);margin-bottom:14px}
.ddl{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-size:13px}
.ddl a,.ddrow .nm>a{color:var(--accent);text-decoration:none;font-weight:600}
.ddl a:hover,.ddrow .nm>a:hover{text-decoration:underline}
.altsw{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px 5px 5px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);flex-shrink:0;margin-left:auto}
.altsw .knob{width:30px;height:18px;border-radius:999px;background:var(--line);position:relative;transition:background .15s}
.altsw .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.altsw[aria-pressed="true"] .knob{background:var(--green)}
.altsw[aria-pressed="true"] .knob::after{left:14px}
.altsw[aria-pressed="true"]{color:var(--ink)}
.search{margin-left:0}
body.noalt .altonly{display:none!important}
@media (max-width:900px){.altsw .lbl{display:none}.altsw{padding:5px}}
.altcat{margin-bottom:12px}
.altcat h3{font-size:14.5px;padding-bottom:6px;border-bottom:2px solid color-mix(in srgb,var(--green) 30%,transparent)}
.altitem{padding:9px 0;border-bottom:1px dashed var(--line)}
.altitem:last-child{border-bottom:0}
.altitem b{font-weight:600}
.altitem p{margin:3px 0 0;font-size:14px;color:var(--muted)}
.ev{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.altnote{background:var(--amberbg);border:1px solid color-mix(in srgb,var(--amber) 28%,transparent);border-radius:12px;padding:11px 14px;font-size:13.5px;margin:0 0 12px}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <button class="navbtn" id="navbtn" aria-label="Open navigation">☰</button>
  <a class="brand" href="#home" aria-label="RheumAtlas home">

<script>
const pm = t => "https://pubmed.ncbi.nlm.nih.gov/?term=" + encodeURIComponent(t);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const AREAS = [];

AREAS.push({
id:"arthritis", name:"Inflammatory Arthritis", short:"Arthritis", color:"#1971c2",
blurb:"Chronic joint and spine inflammation from immune dysregulation. Early treatment to a target of remission is the modern standard.",
subs:[
{id:"ra-group", name:"Peripheral arthritis", diseases:[
{id:"ra", name:"Rheumatoid Arthritis (RA)", aka:"Seropositive / seronegative RA",
ov:"A chronic, systemic autoimmune inflammatory arthritis that typically attacks the small joints of the hands and feet symmetrically. Untreated, it causes cartilage loss and erosions. Early, aggressive treatment preserves joints, and most patients now reach remission or low disease activity.",
sx:["Symmetric swelling and tenderness of the small joints (MCPs, PIPs, wrists) on both sides","Morning stiffness lasting more than an hour","Fatigue, low-grade fever, weight loss, feeling generally unwell","Later: deformities such as ulnar deviation, swan-neck or boutonnière patterns"],
early:["Hand stiffness every morning that eases only after an hour or more","Swelling of the knuckles on both hands that comes and goes","Morning stiffness with fatigue in a person with a family history of autoimmune disease or smoking exposure"],
red:["Fever with a hot, swollen joint (septic arthritis, especially on immunosuppression)","Chest pain or shortness of breath (pleuritis, interstitial lung disease)","Neck pain or new arm weakness or clumsiness (atlantoaxial subluxation)","Red painful eye (scleritis) or new skin ulcers or nerve symptoms (vasculitis)"],
dx:["Clinical pattern: symmetric small-joint synovitis, morning stiffness, duration of symptoms","Serology: rheumatoid factor and anti-citrullinated protein antibodies (ACPA/anti-CCP)","Inflammation markers: CRP and ESR; CBC and liver/kidney function before drugs","Imaging: hand and foot X-rays for erosions; ultrasound or MRI for early synovitis","Classification with the 2010 ACR/EULAR criteria; baseline hepatitis B/C and TB screening before biologics"],
tx:[["Treat to target (remission or low disease activity)",["Methotrexate is usually the first disease-modifying drug (DMARD), often with a short glucocorticoid bridge","Reassess disease activity every 1–3 months and escalate if the target is not met","Add or switch to a biologic: TNF inhibitors, abatacept, IL-6 blockers (tocilizumab, sarilumab), or rituximab"]],["Targeted synthetic DMARDs",["JAK inhibitors (tofacitinib, baricitinib, upadacitinib) are oral options; they carry boxed warnings for serious infection, malignancy, thrombosis and major cardiovascular events","Leflunomide or sulfasalazine as alternatives or additions"]],["Remission",["The EULAR 2025 update advises against stopping DMARDs entirely, even in sustained remission, because flares can follow"]],["Supportive care",["NSAIDs for symptoms, only short term where possible; physical and occupational therapy; splints for flares","Vaccinations before immunosuppression; smoking cessation; cardiovascular risk reduction"]]],
upd:["Mar 2026: EULAR published its 2025 update of the RA management recommendations (Ann Rheum Dis 2026), advising that DMARDs not be discontinued even in sustained remission."],
tags:["joint swelling","morning stiffness","hand pain","fatigue","fever","symmetric"],
refs:[["Smolen JS, et al. EULAR recommendations for the management of rheumatoid arthritis with synthetic and biological DMARDs: 2022 update. Ann Rheum Dis. 2023",pm("EULAR recommendations for the management of rheumatoid arthritis with synthetic and biological DMARDs 2022 update")],["Smolen JS, et al. EULAR recommendations for the management of RA with synthetic and biologic DMARDs: 2025 update. Ann Rheum Dis. 2026",pm("EULAR recommendations for the management of rheumatoid arthritis with synthetic and biologic disease-modifying antirheumatic drugs 2025 update")],["Healio: New EULAR recommendations for rheumatoid arthritis (May 2026)","https://www.healio.com/news/rheumatology/20260714/new-eular-recommendations-for-rheumatoid-arthritis-keep-pace-with-everevolving-field"],["Aletaha D, et al. 2010 Rheumatoid arthritis classification criteria: an ACR/EULAR collaborative initiative. Arthritis Rheum. 2010",pm("2010 Rheumatoid arthritis classification criteria: an American College of Rheumatology/European League Against Rheumatism collaborative initiative")],["American College of Rheumatology: Rheumatoid Arthritis patient resources","https://www.rheumatology.org/"]]},
{id:"psa", name:"Psoriatic Arthritis (PsA)", aka:"Psoriatic spondyloarthritis",
ov:"An inflammatory arthritis that occurs with psoriasis, often years after skin disease appears (sometimes without skin symptoms). It can involve peripheral joints, the spine, entheses (tendon and ligament attachments), and nails. Early diagnosis limits joint damage.",
sx:["Asymmetric arthritis of a few joints, including the DIP joints of the fingers","Dactylitis: sausage-like swelling of a whole finger or toe","Enthesitis: heel pain (Achilles or plantar fascia), elbow or knee tendon pain","Nail pitting, nail separation, and scaly skin patches"],
early:["Finger swelling or pain in a person with psoriasis or a family history of psoriasis","Morning stiffness with heel pain or back pain","New nail changes with joint pain"],

const ADD = (areaId, subId, subName, ds) => {
  const a = AREAS.find(x => x.id === areaId);

  s.diseases.push(...ds);
};

    </div>`).join("") +
    `<h4 style="margin-top:18px">Reference</h4><div class="tlinks">
      ${[["symptoms","Symptom finder"],["labs","Labs & tests"],["drugs","Drug guide"],["emerging","Emerging therapies"],["complementary","Complementary care"],["updates","What's new"],["about","About & sources"]].map(([k,l]) => `<a href="#${k}" class="${cur === k ? "on" : ""} ${k === "complementary" ? "altonly" : ""}">${esc(l)}</a>`).join("")}
    </div>`;
}
$side.addEventListener("click", e => {
  const t = e.target.closest("[data-toggle]");
  if (t) { const id = t.dataset.toggle; openAreas.has(id) ? openAreas.delete(id) : openAreas.add(id); t.parentElement.classList.toggle("open"); return; }
  if (e.target.closest("a")) document.body.classList.remove("nav");
});

const list = (arr, c) => `<ul class="clean" style="--c:${c || "var(--accent)"}">${arr.map(x => `<li>${esc(x)}</li>`).join("")}</ul>`;
const refList = refs => `<ol class="refs">${refs.map(([t, u]) => `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join("")}</ol>`;
const table = (heads, rows, cls = "") => `<div class="card ddt"><div class="ddrow head ${cls}">${heads.map(h => `<div>${esc(h)}</div>`).join("")}</div>${rows.map(r => `<div class="ddrow ${cls}">${r.map((x, i) => `<div class="${i === 0 ? "nm" : i === 1 && r.length > 2 ? "sim" : ""}">${esc(x)}</div>`).join("")}</div>`).join("")}</div>`;
const DISC = `<div class="disc">Educational content only. It does not replace evaluation by a rheumatologist or your own clinician, and drug labels, warnings, and guidelines change — check current prescribing information.</div>`;

function ddxName(d, n) {
  const ids = (DDX_LINK[n] || []).filter(id => id !== d.id && DIS.find(x => x.id === id));
  const nl = DDX_NEURO[n] || [];
  if (ids.length === 1 && !nl.length) return `<a href="#${ids[0]}">${esc(n)} →</a>`;
  const links = ids.map(id => `<a href="#${id}">${esc(short(DIS.find(x => x.id === id).name))} →</a>`)
    .concat(nl.map(([id, l]) => `<a href="${NEURO}${id}" target="_blank" rel="noopener">${esc(l)} in NeuroAtlas ↗</a>`));
  return esc(n) + (links.length ? `<div class="ddl">${links.join("")}</div>` : "");
}
const ddxTable = d => `<div class="card ddt"><div class="ddrow head"><div>Look-alike</div><div>What's similar</div><div>How to tell them apart</div></div>${d.ddx.map(([n, s, g]) => `<div class="ddrow"><div class="nm">${ddxName(d, n)}</div><div class="sim">${esc(s)}</div><div>${esc(g)}</div></div>`).join("")}</div>`;

function vHome() {
  const nUpd = DIS.reduce((t, d) => t + (d.upd ? d.upd.length : 0), 0) + EXTRA_UPD.length;
  return `
  <div class="hero">
    <h1>RheumAtlas</h1>
    <p class="lede">A comprehensive, plain-language reference to rheumatic and musculoskeletal disease: how each condition presents, the warning signs that need prompt care, how it is diagnosed and told apart from look-alikes, and how it is treated today — with links to the guidelines behind it.</p>
    <div class="stats">
      <div class="stat"><b>${AREAS.length}</b><span>disease areas</span></div>
      <div class="stat"><b>${DIS.length}</b><span>conditions</span></div>
      <div class="stat"><b>${DIS.reduce((t, d) => t + d.ddx.length, 0)}</b><span>differential-diagnosis rows</span></div>
      <div class="stat"><b>${nUpd}</b><span>dated updates</span></div>
    </div>
  </div>
  <div class="emerg">
    <h3>Get same-day or emergency care for these</h3>
    <ul class="clean" style="--c:#c92a2a">
      <li>A hot, swollen joint with fever — septic arthritis is treated as an emergency</li>
      <li>Sudden vision loss, or new headache with jaw pain or scalp tenderness after age 50 (giant cell arteritis)</li>
      <li>Coughing blood, breathlessness, or rapidly rising creatinine in someone with vasculitis or lupus</li>
      <li>Muscle weakness with trouble breathing or swallowing, or with chest pain on cancer immunotherapy</li>
      <li>Sudden high blood pressure with worsening kidney function in scleroderma; stridor in relapsing polychondritis</li>
      <li>A child with prolonged fever plus red eyes and lips (Kawasaki disease), or persistent fever with falling blood counts (MAS)</li>
    </ul>
  </div>
  <h2>Disease areas</h2>
  <div class="grid">${AREAS.map(a => `
    <a class="card acard" style="--c:${a.color}" href="#${a.id}">
      <b>${esc(a.name)}</b><p>${esc(a.blurb)}</p>
      <span class="n">${a.subs.reduce((t, s) => t + s.diseases.length, 0)} conditions →</span>
    </a>`).join("")}
  </div>
  <h2>Reference tools</h2>
  <div class="grid">
    <a class="card dcard" href="#symptoms"><b>Symptom finder</b><p>Pick symptoms to see which conditions share them.</p></a>
    <a class="card dcard" href="#labs"><b>Labs &amp; tests</b><p>Autoantibodies, inflammation markers, joint fluid, imaging, and pre-treatment screening.</p></a>
    <a class="card dcard" href="#drugs"><b>Drug guide</b><p>Every major drug class with uses and safety monitoring, plus pregnancy and vaccines.</p></a>
    <a class="card dcard" href="#emerging"><b>Emerging therapies</b><p>CAR-T cell therapy and other approaches in development, with their current status.</p></a>
    <a class="card dcard altonly" href="#complementary"><b>Complementary care</b><p>Exercise, diet, supplements, acupuncture and more — with evidence ratings and interaction warnings.</p></a>
    <a class="card dcard" href="#updates"><b>What's new</b><p>Dated approvals and guideline changes, newest first.</p></a>
  </div>
  ${DISC}`;
}

function vArea(a) {
  return `
  <div class="crumbs"><a href="#home">Home</a> › ${esc(a.name)}</div>
  <h1>${esc(a.name)}</h1>
  <p class="lede">${esc(a.blurb)}</p>
  ${a.subs.map(s => `
    <h2>${esc(s.name)}</h2>
    <div class="grid">${s.diseases.map(d => `
      <a class="card dcard" style="border-top:3px solid ${a.color}" href="#${d.id}">
        <b>${esc(d.name)}</b><p>${esc(d.ov)}</p>
        ${d.upd && d.upd.length ? `<span class="badge" style="background:var(--greenbg);color:var(--green);border-color:color-mix(in srgb,var(--green) 30%,transparent)">Updated</span> ` : ""}${d.red && d.red.length ? `<span class="badge">Red flags</span>` : ""}
      </a>`).join("")}
    </div>`).join("")}
  ${DISC}`;
}

function vDisease(d) {
  const i = DIS.indexOf(d), prev = DIS[i - 1], next = DIS[i + 1], c = d.area.color;
  return `
  <div class="crumbs"><a href="#home">Home</a> › <a href="#${d.area.id}">${esc(d.area.name)}</a> › ${esc(d.sub.name)}</div>
  <h1>${esc(d.name)}</h1>
  ${d.aka ? `<div class="aka">Also called: ${esc(d.aka)}</div>` : ""}
  <div class="pills">${SECS.filter(([k]) => has(d, k)).map(([k, l]) => `<button class="pill" data-jump="${k}">${l}</button>`).join("")}</div>
  <p class="lede sec" id="sec-ov">${esc(d.ov)}</p>
  <div class="two">
    <div class="card sec" id="sec-sx"><h3>Symptoms</h3>${list(d.sx, c)}</div>
    <div class="card k-early sec" id="sec-early"><h3>Early signs &amp; warning clues</h3>${list(d.early || [], c)}</div>
  </div>
  ${has(d, "red") ? `<div class="card k-red sec" id="sec-red" style="margin-top:14px"><h3>⚠ Red flags — seek urgent care</h3>${list(d.red, c)}</div>` : ""}
  <h2 class="sec" id="sec-dx">Diagnosis</h2>
  <div class="card">${list(d.dx, c)}</div>
  ${has(d, "ddx") ? `<h2 class="sec" id="sec-ddx">Differential diagnosis: look-alikes</h2><p class="secnote">Conditions that can be confused with ${esc(d.name)}, what they share, and the clues that tell them apart. Linked names open that condition's page.</p>${ddxTable(d)}` : ""}
  <h2 class="sec" id="sec-tx">Treatment &amp; medications</h2>
  ${d.tx.filter(([, items]) => items.length).map(([t, items]) => `<div class="card txg" style="--c:${c};margin-bottom:12px"><h3>${esc(t)}</h3>${list(items, c)}</div>`).join("")}
  ${has(d, "alt") ? `<h2 class="sec" id="sec-alt">Complementary &amp; lifestyle approaches</h2><div class="altnote">These add to — never replace — the medical treatment above. Evidence labels show how strong the support is; tell your care team about any supplement or herb, since some interact with rheumatology drugs (<a href="#complementary">safety list</a>).</div>${altBlock(d.alt)}${d.altRefs && d.altRefs.length ? `<p class="secnote" style="margin-top:4px">Sources for this section are listed under References.</p>` : ""}` : ""}
  ${has(d, "upd") ? `<div class="card k-upd sec" id="sec-upd" style="margin-top:12px"><h3>Recent updates</h3>${list(d.upd, c)}</div>` : ""}
  <h2 class="sec" id="sec-refs">References</h2>
  ${refList(ALT_ON && d.altRefs ? d.refs.concat(d.altRefs.filter(r => !d.refs.some(x => x[1] === r[1]))) : d.refs)}
  <div class="pager">
    ${prev ? `<a href="#${prev.id}"><small>← Previous</small>${esc(prev.name)}</a>` : `<span></span>`}
    ${next ? `<a href="#${next.id}" style="text-align:right"><small>Next →</small>${esc(next.name)}</a>` : `<span></span>`}
  </div>
  ${DISC}`;
}

let picked = new Set();
function vSymptoms() {
  const counts = {};
  DIS.forEach(d => d.tags.forEach(t => counts[t] = (counts[t] || 0) + 1));
  const tags = Object.keys(counts).sort((a, b) => a.localeCompare(b));
  const hits = picked.size ? DIS.map(d => ({d, n: d.tags.filter(t => picked.has(t)).length})).filter(x => x.n).sort((a, b) => b.n - a.n || a.d.name.localeCompare(b.d.name)) : [];
  return `
  <div class="crumbs"><a href="#home">Home</a> › Symptom finder</div>
  <h1>Symptom finder</h1>
  <p class="lede">Select symptoms to see which conditions in the atlas share them, ranked by how many match. A starting point for a conversation with a clinician, not a diagnosis.</p>
  <div class="chips">${tags.map(t => `<button class="chip ${picked.has(t) ? "on" : ""}" data-t="${esc(t)}">${esc(t)}</button>`).join("")}</div>
  ${picked.size ? `
    <div class="hit"><b>${hits.length}</b> condition${hits.length === 1 ? "" : "s"} match · <a href="#symptoms" data-clear="1" style="color:var(--accent)">clear selection</a></div>
    <div class="grid">${hits.map(({d, n}) => `
      <a class="card dcard" style="border-top:3px solid ${d.area.color}" href="#${d.id}">
        <b>${esc(d.name)}</b><p>${esc(d.ov)}</p><span class="badge">${n} of ${picked.size} selected</span>
      </a>`).join("")}</div>` :
    `<div class="card" style="margin-top:16px;color:var(--muted)">Choose one or more symptoms above.</div>`}
  <div class="disc">Matching is by keyword and can miss or over-include conditions. Persistent or worsening symptoms deserve a clinical assessment.</div>`;
}

function vLabs() {
  return `
  <div class="crumbs"><a href="#home">Home</a> › Labs &amp; tests</div>
  <h1>Labs &amp; tests</h1>
  <p class="lede">What the common rheumatology tests measure and how to read them. No single test diagnoses most rheumatic diseases; results are interpreted with symptoms and examination.</p>
  ${LABS.map(g => `<h2>${esc(g.g)}</h2>${table(["Test", "What it shows", "Interpretation and caveats"], g.rows)}`).join("")}
  <h2>Before starting immunosuppressive therapy</h2>
  <div class="card">${list(SCREEN)}</div>
  ${DISC}`;
}

function vDrugs() {
  return `
  <div class="crumbs"><a href="#home">Home</a> › Drug guide</div>
  <h1>Drug guide</h1>
  <p class="lede">The main drug classes used in rheumatology, what they treat, and the key safety points. Doses and monitoring schedules are set by the prescriber and the product label.</p>
  ${DRUGS.map(g => `<h2>${esc(g.g)}</h2>${table(["Drug or class", "Main uses", "Key safety and monitoring"], g.rows)}`).join("")}
  <h2>Pregnancy and breastfeeding</h2>
  <p class="secnote">Based on the 2020 ACR reproductive health guideline; plan pregnancy with the rheumatology team.</p>
  ${table(["Category", "Drugs and actions"], PREG, "c2")}
  <h2>Vaccines on immunosuppression</h2>
  <div class="card">${list(VACC)}</div>
  <h2>References</h2>
  ${refList([["Sammaritano LR, et al. 2020 ACR Guideline for the Management of Reproductive Health in Rheumatic and Musculoskeletal Diseases. Arthritis Rheumatol. 2020", pm("2020 American College of Rheumatology Guideline for the Management of Reproductive Health in Rheumatic and Musculoskeletal Diseases")],["Bass AR, et al. 2022 ACR Guideline for Vaccinations in Patients With Rheumatic and Musculoskeletal Diseases. Arthritis Care Res. 2023", pm("2022 American College of Rheumatology Guideline for Vaccinations in Patients With Rheumatic and Musculoskeletal Diseases")],["Ytterberg SR, et al. Cardiovascular and Cancer Risk with Tofacitinib in Rheumatoid Arthritis (ORAL Surveillance). N Engl J Med. 2022", pm("Cardiovascular and Cancer Risk with Tofacitinib in Rheumatoid Arthritis")],["Rosenbaum JT, et al. AAO Recommendations on Screening for Hydroxychloroquine Retinopathy (2016 revision). Ophthalmology. 2016", pm("Recommendations on Screening for Chloroquine and Hydroxychloroquine Retinopathy (2016 Revision)")]])}
  ${DISC}`;
}

function vEmerging() {
  return `
  <div class="crumbs"><a href="#home">Home</a> › Emerging therapies</div>
  <h1>Emerging therapies</h1>
  <p class="lede">Treatments in development or newly arriving in rheumatology, and where they stand as of November 2026. Investigational therapies are available only in clinical trials.</p>
  ${EMERGING.map(e => `<div class="card emcard" style="--c:${e.c}"><h3>${esc(e.t)}</h3>${list(e.items, e.c)}</div>`).join("")}
  <h2>References</h2>
  ${refList(EMERGING_REFS)}
  ${DISC}`;
}

function vComplementary() {
  if (!ALT_ON) return `<div class="crumbs"><a href="#home">Home</a> › Complementary care</div><h1>Complementary care</h1><div class="card">Complementary and alternative treatments are switched off. Use the <b>Complementary</b> switch in the header to show them.</div>`;
  const withAlt = DIS.filter(d => d.alt && d.alt.length);
  const top = withAlt.map(d => ({d, g: d.alt.filter(i => i.e === "strong" || i.e === "cond")})).filter(x => x.g.length);
  return `
  <div class="crumbs"><a href="#home">Home</a> › Complementary care</div>
  <h1>Complementary care</h1>
  <p class="lede">Exercise, diet, supplements, herbs, acupuncture, and mind-body therapies that have been studied in rheumatic disease — including those that guidelines recommend against. They complement medical treatment; none replaces disease-modifying therapy where it is needed.</p>
  <h2>How to read the evidence labels</h2>
  ${table(["Label", "Meaning"], [[EV.standard[0], "Established medical advice that applies broadly (e.g., stopping smoking, sun protection in lupus), not a condition-specific trial result"],[EV.strong[0], "A major guideline (ACR, EULAR) makes a strong recommendation for it"],[EV.cond[0], "A guideline recommends it conditionally (benefit likely but evidence weaker; a shared decision)"],[EV.some[0], "Randomized trials or meta-analyses show benefit, usually modest, but no guideline endorsement"],[EV.limited[0], "Small, early, or conflicting studies — uncertain benefit"],[EV.against[0], "A guideline recommends against it, good trials show no benefit, or it is unsafe in this condition"]], "c2")}
  <h2>Herb, supplement and food interactions</h2>
  <p class="secnote">Always tell your rheumatology team and pharmacist about supplements. Products are not reviewed by the FDA for effectiveness; third-party seals (USP, NSF) check contents, not benefit.</p>
  ${table(["Product", "Concern"], ALT_SAFETY, "c2")}
  <h2>Guideline-supported approaches by condition</h2>
  ${top.map(({d, g}) => `<div class="card altcat"><h3><a href="#${d.id}" style="color:var(--accent);text-decoration:none">${esc(d.name)} →</a></h3>${g.map(i => `<div class="altitem"><b>${esc(i.t)}</b>${evBadge(i.e)}</div>`).join("")}</div>`).join("")}
  <h2>References</h2>
  ${refList([ACR_RA_INT, ACR_OA, EULAR_FM, ACR_GOUT, GIOP, VITAL, NCCIH])}
  ${DISC}`;
}

const MON = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Sept:8,Oct:9,Nov:10,Dec:11};
const dkey = u => { const h = u.split(":")[0].trim().split(/\s+/); return h.length === 2 ? (+h[1]) * 12 + (MON[h[0]] ?? 0) : (+h[0]) * 12 - 1; };
function vUpdates() {
  const items = DIS.filter(d => d.upd && d.upd.length).flatMap(d => d.upd.map(u => ({name: d.name, href: "#" + d.id, u})))
    .concat(EXTRA_UPD).sort((a, b) => dkey(b.u) - dkey(a.u));
  return `
  <div class="crumbs"><a href="#home">Home</a> › What's new</div>
  <h1>What's new</h1>
  <p class="lede">Approvals, safety actions, and guideline changes recorded in the atlas, newest first (${items.length} items). Each links to the condition page and its sources.</p>
  <div class="updlist">${items.map(x => `
    <div class="u"><time>${esc(x.u.split(":")[0])}</time><div><a href="${x.href}">${esc(x.name)}</a><div style="font-size:14px;margin-top:3px">${esc(x.u.slice(x.u.indexOf(":") + 2))}</div></div></div>`).join("")}
  </div>
  <div class="disc">Items were checked against news, regulatory, and guideline sources in November 2026. Other recent changes may exist; confirm with prescribing information before acting.</div>`;
}

function vAbout() {
  return `
  <div class="crumbs"><a href="#home">Home</a> › About &amp; sources</div>
  <h1>About &amp; sources</h1>
  <p class="lede">RheumAtlas is a plain-language reference for rheumatic and musculoskeletal conditions. Condition pages draw on guidelines and classification criteria from the American College of Rheumatology (ACR), the European Alliance of Associations for Rheumatology (EULAR), ASAS, GRAPPA, KDIGO, AHA, IDSA, and specialty consensus statements, with dated news sources for recent approvals.</p>
  <div class="card"><h3>Each condition page includes</h3>${list(["Overview, symptoms, and early warning clues","Red flags that need prompt or emergency care","Diagnosis, including tests and classification criteria","A differential-diagnosis table of look-alike conditions","Treatment organized by stage or severity, recent updates, and references"])}</div>
  <h2>Limitations</h2>
  <div class="card">${list(["Drug approvals, boxed warnings, and guideline versions change; check current prescribing information", "Recent approvals were checked against news and regulatory sources in November 2026; background clinical content reflects established guidelines but has not been reviewed by a clinician", "Individual care depends on history, examination, other conditions, pregnancy plans, and local availability", "Some reference links open a PubMed search for the cited title rather than the article page"], "var(--amber)")}</div>
  <div class="disc">For emergencies, call your local emergency number. This site does not provide medical advice.</div>`;
}

const hay = d => (d.name + " " + (d.aka || "") + " " + d.tags.join(" ") + " " + d.ov + " " + d.tx.map(t => t[0] + " " + t[1].join(" ")).join(" ")).toLowerCase();
DIS.forEach(d => { d._h = hay(d); d._ha = (d.alt || []).map(i => i.t + " " + i.n).join(" ").toLowerCase(); d._n = (d.name + " " + (d.aka || "")).toLowerCase(); });
function search(q) {
  const s = q.trim().toLowerCase();
  if (s.length < 2) return [];
  return DIS.map(d => ({d, r: d._n.includes(s) ? 0 : d.tags.some(t => t.includes(s)) ? 1 : d._h.includes(s) ? 2 : ALT_ON && d._ha.includes(s) ? 3 : 9})).filter(x => x.r < 9).sort((a, b) => a.r - b.r).slice(0, 10).map(x => x);
}

function render(keep) {
  const id = location.hash.slice(1) || "home";
  document.body.classList.remove("nav");
  document.querySelectorAll(".toplinks a").forEach(a => a.classList.toggle("on", a.dataset.v === id));
  const views = {complementary: vComplementary, home: vHome, symptoms: vSymptoms, labs: vLabs, drugs: vDrugs, emerging: vEmerging, updates: vUpdates, about: vAbout};
  let html, cur = id;
  if (views[id]) html = views[id]();
  else {
    const a = AREAS.find(x => x.id === id), d = DIS.find(x => x.id === id);
    if (a) html = vArea(a); else if (d) html = vDisease(d); else { html = vHome(); cur = "home"; }
  }
  $view.innerHTML = html;
  renderSide(cur);
  if (!keep) window.scrollTo({top: 0});
}
window.addEventListener("hashchange", render);

$view.addEventListener("click", e => {
  const j = e.target.closest("[data-jump]");
  if (j) { const el = document.getElementById("sec-" + j.dataset.jump); if (el) el.scrollIntoView({behavior: "smooth", block: "start"}); return; }
  if (e.target.closest("[data-clear]")) { e.preventDefault(); picked.clear(); $view.innerHTML = vSymptoms(); return; }
  const c = e.target.closest(".chip");
  if (!c) return;
  const t = c.dataset.t;
  picked.has(t) ? picked.delete(t) : picked.add(t);
  const y = window.scrollY; $view.innerHTML = vSymptoms(); window.scrollTo({top: y});
});

$q.addEventListener("input", () => {
  if (!$q.value.trim()) { $res.classList.remove("show"); return; }
  const hits = search($q.value);
  $res.innerHTML = hits.length ? hits.map(({d, r}) => `<a class="res" href="#${d.id}"><b>${esc(d.name)}</b><small>${esc(d.area.name)}${r === 2 ? " · mentioned in treatment or overview" : r === 3 ? " · complementary approaches" : ""}</small></a>`).join("") : `<div class="nores">No matches</div>`;
  $res.classList.add("show");
});
$q.addEventListener("keydown", e => {
  if (e.key === "Enter") { const f = $res.querySelector("a"); if (f) { location.hash = f.getAttribute("href"); $q.value = ""; $res.classList.remove("show"); $q.blur(); } }
  if (e.key === "Escape") { $q.value = ""; $res.classList.remove("show"); $q.blur(); }
});
$res.addEventListener("click", () => { $res.classList.remove("show"); $q.value = ""; });
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $q && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); $q.focus(); } });
document.addEventListener("click", e => { if (!e.target.closest(".search")) $res.classList.remove("show"); });
$("#navbtn").addEventListener("click", () => document.body.classList.toggle("nav"));
$("#scrim").addEventListener("click", () => document.body.classList.remove("nav"));
applyAlt();
render();

</script>
</body>
</html>
